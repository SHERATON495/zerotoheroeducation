  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;

      justify-content: center;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(145deg, #071b2c, #102f46 55%, #06131f);
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      text-align: center;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }
    .logo {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #20b8e8;
      background: #18384b;
      margin-bottom: 14px;
    }
    .title { margin: 0 0 24px; font-size: 26px; line-height: 1.2; }
    .features { display: grid; gap: 12px; text-align: left; margin-bottom: 26px; }
    .feature {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 12px;
      background: rgba(255,255,255,.08);
    }
    .icon { width: 28px; text-align: center; font-size: 21px; color: #39c7f3; }
    .timer-row { margin: 0 0 22px; }
    .progress-container {
      height: 7px; border-radius: 10px; background: #355165;
      position: relative; overflow: hidden; margin-bottom: 9px;
    }
    .progress-bar {
      height: 100%; width: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #16c5e8, #4be0a6);
      animation: countdown 55s linear forwards;
    }
    .timer { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    .telegram-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px; border-radius: 12px;
      color: #fff; text-decoration: none; font-weight: 700; font-size: 18px;
      background: linear-gradient(90deg, #168fe5, #20b9d8);
      box-shadow: 0 8px 22px rgba(22,143,229,.28);
    }
    .telegram-btn:active { transform: scale(.99); }
    .telegram-icon { font-size: 21px; }
    .subscribers { margin: 18px 0 16px; color: #c8dbe6; font-size: 14px; }
    .disclaimer { color: #b8c8d2; font-size: 11px; line-height: 1.6; }
    @keyframes countdown { from { width: 100%; } to { width: 0%; } }
  </style>

  <script>
    let remaining = 55;
    const timer = document.getElementById('timer');
    const countdown = setInterval(() => {
      remaining = Math.max(0, remaining - 1);
      timer.textContent = '00:' + String(remaining).padStart(2, '0');
      if (remaining <= 0) clearInterval(countdown);
    }, 1000);
  </script>
